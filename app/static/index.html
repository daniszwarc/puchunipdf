<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chatpdf</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="doc">
<header id="bar">
  <strong class="brand">chatpdf</strong>
  <div id="picker">
    <button id="picker-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Select document"></button>
    <ul id="docs" role="listbox" aria-label="Documents" hidden></ul>
  </div>
  <button id="upload" type="button">Upload</button>
  <input id="file" type="file" accept="application/pdf" hidden>
  <button id="delete" type="button" disabled>Delete</button>
  <span id="status" role="status"></span>
  <button id="logout" type="button">Log out</button>
</header>
<nav id="tabs" role="tablist" aria-label="View">
  <button role="tab" data-tab="doc" aria-selected="true">Document</button>
  <button role="tab" data-tab="chat" aria-selected="false">Chat</button>
</nav>
<div id="panes">
  <section id="docpane" aria-label="Document">
    <div id="vbar" inert>
      <button id="prev" type="button" aria-label="Previous page">‹</button>
      <input id="pg" type="number" min="1" value="1" aria-label="Page number">
      <span id="pgtotal">/ –</span>
      <button id="next" type="button" aria-label="Next page">›</button>
      <span class="sep"></span>
      <button id="zout" type="button" aria-label="Zoom out">−</button>
      <button id="zin" type="button" aria-label="Zoom in">+</button>
      <button id="fit" type="button">Fit width</button>
    </div>
    <div id="viewer" tabindex="0"><p class="hint">Select or upload a document.</p></div>
    <div id="toast" role="status" hidden></div>
  </section>
  <section id="chatpane" aria-label="Chat">
    <div id="chathead"><span>Conversation</span><button id="newchat" type="button" disabled>New chat</button></div>
    <div id="log" aria-live="polite"><p class="hint">Select or upload a document, then ask a question.</p></div>
    <form id="form">
      <input id="q" placeholder="Select a document to start" autocomplete="off" disabled>
      <button disabled>Send</button>
    </form>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
